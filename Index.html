<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#CFE9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Goldstack Keep: an anime castle-defense game. Carry gold, raise walls, recruit samurai and defend fifteen lands from the oni horde.">
<title>Goldstack Keep</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme: light only; }
  html,body{ margin:0; height:100%; background:#CFE9F5; color:#1F2B22; color-scheme: light only; }
  @media (prefers-color-scheme: dark){ html,body{ background:#CFE9F5 !important; color:#1F2B22 !important; color-scheme: light only; } }
  #boot{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; text-align:center;
    font-family:"Lilita One","Trebuchet MS",sans-serif; font-size:26px; color:#8A5A0A; }
  #boot i{ width:46px; height:46px; border-radius:50%; background:#F5B820; box-shadow:inset 0 -6px 0 #A8760A; animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotateY(360deg) } }
  #bootStep{ font-family:"Nunito Sans",sans-serif; font-weight:800; font-size:14px; color:#4A4453; max-width:34ch; }
  #bootErr{ font-family:"Nunito Sans",sans-serif; font-weight:800; font-size:13px; color:#B3261E; background:#fff; border-radius:12px; padding:10px 12px; max-width:36ch; display:none; word-break:break-word; }
  #bootErr b{ display:block; margin-bottom:4px; }
</style>
</head>
<body>
<div id="boot">
  <i></i>
  <div>Loading Goldstack Keep</div>
  <div id="bootStep">Starting…</div>
  <div id="bootErr"></div>
</div>
<script>
  /* ---- Accounts and cloud saves: paste your Supabase project URL and anon (public) key, then commit. ---- */
  window.GK_SUPABASE = null;
  // window.GK_SUPABASE = { url: "https://YOUR-PROJECT.supabase.co", key: "YOUR-ANON-PUBLIC-KEY" };

  /* ---- loader with on-screen diagnostics ---- */
  (function(){
    var step=document.getElementById('bootStep'), errBox=document.getElementById('bootErr'), done=false;
    var REMOTE='https://upload.higgsfield.ai/user_3GV3qOPm6iGGSW2lq6tFLbT5Fsw/cdda2447-8eb3-4e57-9238-d481a6f08310.js';
    function say(t){ step.textContent=t; }
    function fail(title,detail){ errBox.style.display='block'; errBox.innerHTML='<b>'+title+'</b>'+(detail||''); }
    window.addEventListener('error',function(e){
      if(done) return;
      if(e.target&&e.target.tagName==='SCRIPT'){ fail('A file failed to load',String(e.target.src||'').slice(0,120)); return; }
      fail('Error while starting', (e.message||'')+' — '+String(e.filename||'').split('/').pop()+':'+(e.lineno||''));
    },true);
    function load(src,label,next){
      say(label); var s=document.createElement('script'); s.src=src; s.async=false;
      s.onload=next; s.onerror=function(){ fail('Could not download '+label.toLowerCase(), src.slice(0,120)); };
      document.head.appendChild(s);
    }
    function start(){
      load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','Loading 3D engine…',function(){
        if(!window.THREE){ fail('3D engine did not start','Your browser may block WebGL.'); return; }
        say('Downloading game (3.4 MB)…');
        var s=document.createElement('script'); s.src=REMOTE; s.async=false;
        s.onload=ok; s.onerror=function(){ fail('Could not download the game files',REMOTE.slice(0,120)); };
        document.head.appendChild(s);
      });
    }
    function ok(){ done=true; var b=document.getElementById('boot'); if(b) b.remove(); }
    if(window.GK_SUPABASE){ load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js','Loading accounts…',start); }
    else start();
    setTimeout(function(){ if(!done&&errBox.style.display!=='block') fail('Still loading','If this stays here, your connection may be blocking one of the files. Tell Claude what this box says.'); },25000);
  })();
</script>
</body>
</html>

<style>
  :root{ color-scheme: light only; }
  html,body{ margin:0; height:100%; background:#CFE9F5; color:#1F2B22; color-scheme: light only; }
  @media (prefers-color-scheme: dark){ html,body{ background:#CFE9F5 !important; color:#1F2B22 !important; color-scheme: light only; } }
  #boot{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; text-align:center;
    font-family:"Lilita One","Trebuchet MS",sans-serif; font-size:26px; color:#8A5A0A; }
  #boot i{ width:46px; height:46px; border-radius:50%; background:#F5B820; box-shadow:inset 0 -6px 0 #A8760A; animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotateY(360deg) } }
  #bootStep{ font-family:"Nunito Sans",sans-serif; font-weight:800; font-size:14px; color:#4A4453; max-width:34ch; }
  #bootVer{ font-family:"Nunito Sans",sans-serif; font-weight:800; font-size:11px; color:#8A7F72; }
  #bootErr{ font-family:"Nunito Sans",sans-serif; font-weight:800; font-size:13px; color:#B3261E; background:#fff; border-radius:12px; padding:10px 12px; max-width:36ch; display:none; word-break:break-word; }

<script>
  /* Accounts and cloud saves */
  window.GK_SUPABASE = { url: "https://xrsvrvrqrctvufkneizs.supabase.co", key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhyc3ZydnJxcmN0dnVma25laXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDQ2NzQsImV4cCI6MjA5ODk4MDY3NH0.R372wC1w81zfMjLMjG7L_sFKM67bdVoGd3-E4JUQ97s" };

  (function(){
    var GAME='./goldstack-keep-game.js?v=94';   /* the game now lives in your own repo */
    var step=document.getElementById('bootStep'), errBox=document.getElementById('bootErr'), done=false;
    function say(t){ step.textContent=t; }
    function fail(t,d){ errBox.style.display='block'; errBox.innerHTML='<b>'+t+'</b><br>'+(d||''); }
    window.addEventListener('error',function(e){ if(done) return;
      if(e.target&&e.target.tagName==='SCRIPT'){ fail('A file failed to load',String(e.target.src||'').slice(0,120)); return; }
      fail('Error while starting',(e.message||'')+' — '+String(e.filename||'').split('/').pop()+':'+(e.lineno||'')); },true);
    function load(src,label,next){ say(label); var s=document.createElement('script'); s.src=src; s.async=false;
      s.onload=next; s.onerror=function(){ fail('Could not load '+label.toLowerCase(),src.slice(0,120)); };
      document.head.appendChild(s); }
    /* art now lives in real image files: warm the browser cache in parallel before the game starts,
       without decoding every image up front (that would use far more memory than the game needs) */
    /* v94: the game no longer waits for all ~290 art files. It starts straight away; every image still loads the moment
       the game first uses it, and the rest is warmed into the cache in the background, most-needed first
       (world props and effects, then troops and enemies, then early-stage bosses and heroes, then portraits). */
    function preloadArt(next){ next(); setTimeout(warmArt, 1500); }
    function warmArt(){ var A=window.GKA||{}, urls=[], seen={};
      function add(u){ if(typeof u==='string'&&u.indexOf('assets/')===0&&!seen[u]){ seen[u]=1; urls.push(u); } }
      var S=A.SPR||{}, N=A.ANIM||{}, P=A.ART||{}, k;
      for(k in S) add(S[k]);
      ['archer','samurai','onmyoji','ninja','bandit','oni','espear','earcher','eshaman','eshield','esapper','eflier','etunnel','hero'].forEach(function(c){ add(N[c]); });
      for(k in N) add(N[k]);
      for(k in P) add(P[k]);
      var i=0; function one(){ if(i>=urls.length) return; var u=urls[i++];
        var go2=function(){ fetch(u,{cache:'force-cache',priority:'low'}).then(function(r){ return r.ok?r.arrayBuffer():null; }).catch(function(){ return null; }).then(one); };
        if(window.requestIdleCallback) requestIdleCallback(go2,{timeout:2000}); else setTimeout(go2,30); }
      for(var c=0;c<3;c++) one(); }
    function go(){
      if(!window.THREE){ fail('3D engine did not start','Your browser may be blocking WebGL.'); return; }
      load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js','Loading accounts…',function(){
      load('./goldstack-art-core.js?v=90','Loading artwork…',function(){
      load('./goldstack-art-gods.js?v=90','Loading the gods…',function(){
      load('./goldstack-art-kaiju.js?v=94','Summoning the Kaiju…',function(){
      preloadArt(function(){
      load('./goldstack-3d-chars.js?v=90','Loading 3D characters…',function(){
      load('./goldstack-3d-world.js?v=90','Building the village…',function(){
      load(GAME,'Loading game…',function(){ done=true; var b=document.getElementById('boot'); if(b) b.remove(); });
      });
      });
      });
      });
      });
      });
      });
    }
    say('Loading 3D engine…');
    if(window.THREE) go(); else window.addEventListener('gk-three',go,{once:true});
    setTimeout(function(){ if(!window.THREE&&errBox.style.display!=='block') fail('3D engine did not start','This game needs iOS or iPadOS 16.4 or newer.'); },25000);
    /* only complain when nothing has progressed for 30 seconds, so a slow but working download is left alone */
    var lastStep=Date.now(), _say=say; say=function(t){ lastStep=Date.now(); _say(t); };
    var watch=setInterval(function(){ if(done){ clearInterval(watch); return; } if(Date.now()-lastStep>30000&&errBox.style.display!=='block'){ clearInterval(watch); fail('Still loading','If this stays, tell Claude what this box says.'); } },2000);
  })();
</script>

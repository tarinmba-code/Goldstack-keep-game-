  #bootVer{ position:absolute; right:10px; bottom:calc(6px + env(safe-area-inset-bottom)); font-weight:800; font-size:10px; color:rgba(255,255,255,.45); }
  #bootErr{ display:none; margin-top:12px; background:rgba(20,10,40,.85); border:2px solid #FFC93C; border-radius:14px; padding:12px 14px; font-weight:800; font-size:14px; color:#fff; }
  #bootErr button{ margin-top:8px; font-family:"Lilita One",sans-serif; font-size:18px; color:#4a2a00; background:linear-gradient(180deg,#FFE27A,#F0A21B); border:3px solid #6B3A06; border-radius:12px; padding:6px 22px; box-shadow:0 3px 0 #6B3A06; }
  #bootErr details{ margin-top:8px; font-size:10px; font-weight:600; color:rgba(255,255,255,.55); word-break:break-word; }
  @media (prefers-reduced-motion: reduce){ #boot *{ animation:none !important } }
